<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>James Clarke</title>
<meta property="og:title" content="James Clarke">
<meta property="og:url" content="https://portfolio-6z1w.onrender.com/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0908'/><text x='8' y='12.5' font-size='11' font-family='monospace' fill='%23ffb000' text-anchor='middle'>@</text></svg>">
<script>try{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch{}</script>
<style>
  :root {
    color-scheme: dark light;
    --bg: light-dark(#f2efe9, #0a0908);
    --amber: light-dark(#a05a00, #ffb000);
    --bright: light-dark(#6b3c00, #ffd75f);
    --glow: light-dark(transparent, rgba(255, 176, 0, 0.45));
    --text: light-dark(#1c1a17, #e8e4dc);
    --dim: light-dark(#6f6a61, #8a857c);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font: 16px/1.5 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    color: var(--text);
    min-height: 100svh;
  }
  a { color: var(--amber); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; justify-content: flex-end; }
  #theme {
    padding: 0.25rem;
    background: none;
    border: 0;
    font: inherit;
    font-size: 0.85rem;
    color: var(--dim);
    cursor: pointer;
  }
  #theme:hover { color: var(--amber); }
  main {
    display: grid;
    justify-items: center;
    gap: 0.75rem;
    padding: clamp(0.75rem, 2.5vw, 1.25rem) 0 clamp(2rem, 8vw, 3.5rem);
  }
  header, #frame, #meta, h2, #work {
    width: min(100% - 2rem, 840px);
  }
  #frame {
    position: relative;
    overflow: hidden;
    touch-action: pan-y;
    aspect-ratio: 7 / 4;
  }
  #field, #bright {
    position: absolute;
    top: 0; left: 0;
    margin: 0;
    font: 10px/1 ui-monospace, Menlo, Consolas, monospace;
    user-select: none;
    pointer-events: none;
  }
  #field { color: var(--amber); }
  #bright { color: var(--bright); text-shadow: 0 0 6px var(--glow); }
  #meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }
  #source { font-size: 0.85rem; }
  #who h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  #who .links {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
  }
  h2 {
    margin: 0.75rem 0 0;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--dim);
  }
  #work {
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: proj;
    display: grid;
    gap: 0.5rem;
    color: var(--dim);
  }
  #work li {
    display: grid;
    grid-template-columns: 4ch 1fr;
  }
  #work li::before {
    counter-increment: proj;
    content: "0" counter(proj);
  }
  #work .desc::before { content: ", "; }
  @media (max-width: 599px) {
    #frame { aspect-ratio: 10 / 9; }
    #work .desc {
      display: block;
      font-size: 0.85rem;
    }
    #work .desc::before { content: none; }
  }
</style>
</head>
<body>
<main>
  <header><button id="theme" type="button" aria-label="toggle color scheme">light</button></header>
  <div id="frame" aria-hidden="true"><pre id="field"></pre><pre id="bright"></pre></div>
  <div id="meta">
    <div id="who">
      <h1>James Clarke</h1>
      <p class="links"><a href="https://github.com/james-clarke">github</a>, <a href="mailto:jclarkie23@icloud.com">email</a></p>
    </div>
    <a id="source" href="https://github.com/james-clarke/portfolio" title="source code">source</a>
  </div>
  <h2>work:</h2>
  <ol id="work">
    <li><div><a href="https://www.fimsmfg.com">fims mfg</a><span class="desc">production manufacturing site + cms</span></div></li>
  </ol>
</main>
<script src="main.js"></script>
</body>
</html>
