<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>James Clarke</title>
<meta name="description" content="James Clarke: systems, graphics, web">
<meta property="og:title" content="James Clarke">
<meta property="og:description" content="systems, graphics, web">
<meta property="og:url" content="https://portfolio-6z1w.onrender.com/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0908'/><text x='8' y='12.5' font-size='11' font-family='monospace' fill='%23ffb000' text-anchor='middle'>@</text></svg>">
<script>try{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch{}</script>
<style>
  :root {
    color-scheme: dark light;
    --bg: light-dark(#f2efe9, #0a0908);
    --amber: light-dark(#a05a00, #ffb000);
    --bright: light-dark(#6b3c00, #ffd75f);
    --glow: light-dark(transparent, rgba(255, 176, 0, 0.45));
    --text: light-dark(#1c1a17, #e8e4dc);
    --dim: light-dark(#6f6a61, #8a857c);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font: 16px/1.5 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    color: var(--text);
    min-height: 100svh;
  }
  a { color: var(--amber); text-decoration: none; }
  a:hover { text-decoration: underline; }
  #theme {
    position: fixed;
    top: 1rem;
    right: 1.25rem;
    padding: 0.25rem;
    background: none;
    border: 0;
    font: inherit;
    font-size: 0.85rem;
    color: var(--dim);
    cursor: pointer;
  }
  #theme:hover { color: var(--amber); }
  main {
    display: grid;
    justify-items: center;
    gap: 0.75rem;
    padding: 3rem 0 3.5rem;
  }
  #frame {
    width: min(92vw, 840px);
    position: relative;
    overflow: hidden;
    touch-action: none;
  }
  #field, #bright {
    position: absolute;
    top: 0; left: 0;
    margin: 0;
    font: 10px/1 ui-monospace, Menlo, Consolas, monospace;
    user-select: none;
    pointer-events: none;
  }
  #field { color: var(--amber); }
  #bright { color: var(--bright); text-shadow: 0 0 6px var(--glow); }
  #meta {
    width: min(92vw, 840px);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  #source { font-size: 0.85rem; }
  #who { text-align: left; }
  #who h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  #who .links {
    margin-left: 0.5rem;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: normal;
  }
  #tag { margin: 0.15rem 0 0; color: var(--dim); font-size: 0.9rem; }
  #work {
    width: min(92vw, 840px);
    margin: 1.5rem 0 0;
    padding: 0;
    list-style: none;
    counter-reset: proj;
    display: grid;
    gap: 0.5rem;
    color: var(--dim);
  }
  #work li::before {
    counter-increment: proj;
    content: "0" counter(proj) "  ";
  }
</style>
</head>
<body>
<button id="theme" type="button" aria-label="toggle color scheme">light</button>
<main>
  <div id="frame" aria-hidden="true"><pre id="field"></pre><pre id="bright"></pre></div>
  <div id="meta">
    <div id="who">
      <h1>James Clarke <span class="links"><a href="https://github.com/james-clarke">github</a>, <a href="mailto:jclarkie23@icloud.com">email</a></span></h1>
      <p id="tag">systems, graphics, web</p>
    </div>
    <a id="source" href="https://github.com/james-clarke/portfolio" title="source code">source</a>
  </div>
  <ol id="work">
    <li><a href="https://www.fimsmfg.com">fims mfg</a>, production manufacturing site + cms</li>
  </ol>
</main>
<script src="main.js"></script>
</body>
</html>
